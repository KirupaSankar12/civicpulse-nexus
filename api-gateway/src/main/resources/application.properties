server.port=8080

spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ─── Keycloak JWT Resource Server ───────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/civicpulse

# ─── Gateway Routes ─────────────────────────────────────────────────────────
# Route: /api/citizens/** → citizen-service (port 8082)
spring.cloud.gateway.server.webmvc.routes[0].id=citizen-service-api
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/citizens/**

# Route: /api/complaints/** → grievance-service (port 8083)
spring.cloud.gateway.server.webmvc.routes[1].id=grievance-service-api
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/complaints/**

# Route: /api/officers/** → grievance-service (port 8083)
spring.cloud.gateway.server.webmvc.routes[2].id=grievance-service-officers
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/officers/**

# Route: /api/departments/** → grievance-service (port 8083)
spring.cloud.gateway.server.webmvc.routes[3].id=grievance-service-departments
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/departments/**

# Route: /api/services/** → service-management-service (port 8085)
spring.cloud.gateway.server.webmvc.routes[8].id=service-management-api
spring.cloud.gateway.server.webmvc.routes[8].uri=http://localhost:8085
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/api/services/**

# Route: /api/dashboard/** → grievance-service (port 8083) for dashboard stats
spring.cloud.gateway.server.webmvc.routes[9].id=grievance-service-dashboard
spring.cloud.gateway.server.webmvc.routes[9].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[9].predicates[0]=Path=/api/dashboard/**

# Legacy prefix routes (kept for backward compatibility)
spring.cloud.gateway.server.webmvc.routes[4].id=citizen-service
spring.cloud.gateway.server.webmvc.routes[4].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/citizen-service/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[5].id=grievance-service
spring.cloud.gateway.server.webmvc.routes[5].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/grievance-service/**
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[6].id=notification-service
spring.cloud.gateway.server.webmvc.routes[6].uri=http://localhost:8084
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/notification-service/**
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[7].id=service-management-service
spring.cloud.gateway.server.webmvc.routes[7].uri=http://localhost:8085
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/service-management-service/**
spring.cloud.gateway.server.webmvc.routes[7].filters[0]=StripPrefix=1

# ─── CORS ───────────────────────────────────────────────────────────────────
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

