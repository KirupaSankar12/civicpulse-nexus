server.port=8082
spring.application.name=citizen-service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:postgresql://localhost:5432/civicpulse_db
spring.datasource.username=postgres
spring.datasource.password=civic@12

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/civicpulse

# Keycloak Admin API (for self-registration)
keycloak.admin.server-url=http://localhost:8180
keycloak.admin.realm=civicpulse
keycloak.admin.username=admin
keycloak.admin.password=admin